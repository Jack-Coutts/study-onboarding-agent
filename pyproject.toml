[project]
name = "study-onboarding-agent"
version = "0.1.0"
description = "Agent-written converters for public metabolomics deposits, checked outside the agent's reach"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[project.scripts]
onboard = "onboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onboard", "contract", "reference"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    ".agents/skills/scripts",
    ".agents/skills/reviewing-prs/scripts",
    "onboard",
    "contract",
    "reference",
    "tests",
]

# Test helpers and fakes stay readable without full annotations; their bodies
# are still type-checked.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: needs a running Docker daemon; skipped when it is absent"]
