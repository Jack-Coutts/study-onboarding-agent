model: claude-opus-5-5
effort: high
max_tokens: 16000
limits:
  requests: 12
  submissions: 4
  wall_clock_seconds: 900
  usd: 3.00
  sandbox_seconds: 120
prices_per_million_tokens:     # checked 2026-10-03; check current prices before relying on these
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  # DeepSeek peak-hour rates for cache misses, so the cost limit is an upper bound.
  deepseek-flash: {input: 0.30, output: 1.20, provider: deepseek}
  deepseek-v4-pro: {input: 1.32, output: 3.96, provider: deepseek}
  # GPT through a local CLIProxyAPI/EasyCLIProxyAPI signed in with ChatGPT. Usage
  # counts against the ChatGPT plan, so the usd limit never triggers; the request,
  # submission, and time limits still apply.
  gpt-5.5: {input: 0.0, output: 0.0, provider: cliproxy}
# Models without a provider use the Anthropic API. Others are called through their
# Anthropic-compatible endpoint, with their own key and never the Anthropic one.
providers:
  deepseek:
    base_url: https://api.deepseek.com/anthropic
    api_key_env: DEEPSEEK_API_KEY
  cliproxy:
    base_url: http://127.0.0.1:8317     # the proxy's listening port
    api_key_env: CLIPROXY_API_KEY       # a client key from the proxy's access.api-keys
sandbox:
  image: study-onboarding-runner
  # Local image ID printed by `onboard check-sandbox --build`. Runs use this ID,
  # not the tag, so a rebuilt image cannot silently replace the checked one.
  digest: sha256:REPLACE
eval:
  runs_per_task: 2
